# Optional static NFS volume for Ollama local model weights (/root/.ollama).
# Enable by setting OLLAMA_NFS_SERVER and OLLAMA_NFS_PATH in k3s/config.env.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: reaperc2-ollama-nfs-pv
  labels:
    app: ollama
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: 192.168.1.100
    path: /export/ollama-models
