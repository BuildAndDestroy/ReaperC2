# MongoDB credentials for in-cluster mongo (k3s/mongodb.yaml).
# App user is created on database reaperc2-metric at first boot (mongo/init-app-user.js).
# Edit before first deploy. After Mongo has initialized the volume, changing root_*
# or app_* requires resetting the NFS export (see k3s/README.md).
apiVersion: v1
kind: Secret
metadata:
  name: reaperc2-mongodb-secrets
  namespace: reaperc2-ns
type: Opaque
stringData:
  root_username: mongo-root
  root_password: k3s-change-me-root-password
  app_username: api_user
  app_password: k3s-change-me-app-password
