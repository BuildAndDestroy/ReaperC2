# MongoDB on NFS (see mongodb-nfs-pv.yaml). App user bootstrapped on first empty volume;
# seed collections after deploy: ./deployments/k3s/scripts/seed-mongo.sh
#
# mongo:7 requires ARMv8.2-A (Pi 5 / BCM2712). Pi 4 workers fail with illegal instruction.
# Pin to the control-plane node via nodeSelector (MONGO_NODE_HOSTNAME in config.env).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-pvc
  namespace: reaperc2-ns
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: reaperc2-mongo-nfs-pv
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: reaperc2-ns
spec:
  serviceName: mongodb-service
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      nodeSelector:
        kubernetes.io/hostname: pi-master
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: reaperc2-mongodb-secrets
                  key: root_username
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: reaperc2-mongodb-secrets
                  key: root_password
            - name: MONGO_APP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: reaperc2-mongodb-secrets
                  key: app_username
            - name: MONGO_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: reaperc2-mongodb-secrets
                  key: app_password
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: mongo-scripts
              mountPath: /scripts
              readOnly: true
            - name: mongo-init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command:
                - /scripts/mongo-healthcheck.sh
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - /scripts/mongo-healthcheck.sh
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mongo-pvc
        - name: mongo-scripts
          configMap:
            name: mongo-scripts
            defaultMode: 0755
        - name: mongo-init
          configMap:
            name: mongo-init
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
  namespace: reaperc2-ns
spec:
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017
  clusterIP: None
