# First admin UI operator when the MongoDB operators collection is empty.
# Edit before first deploy (or before first ReaperC2 pod start). After bootstrap,
# change password in the UI or insert operators in MongoDB; updating this secret
# alone does not reset existing operators.
apiVersion: v1
kind: Secret
metadata:
  name: reaperc2-admin-bootstrap
  namespace: reaperc2-ns
type: Opaque
stringData:
  username: admin
  password: changeme
